# Minimal kube-prometheus-stack for single-node k3s (Sentinel-X W3 prerequisite).
# Exposes Prometheus on NodePort 30909 for host + MCP docker (host.docker.internal:30909).

grafana:
  enabled: false

alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
  service:
    type: NodePort
    nodePort: 30909

kube-state-metrics:
  # registry.k8s.io redirects to pkg.dev (often blocked); W3 container_cpu does not require KSM
  enabled: false

prometheus-node-exporter:
  enabled: true

# k3s single-node: disable admission webhook hooks + operator TLS (no admission secret)
prometheusOperator:
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
    certManager:
      enabled: false
    failurePolicy: Ignore
