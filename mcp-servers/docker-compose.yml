services:
  mcp-k8s:
    build: ./k8s
    image: sentinel-x-mcp-k8s:latest
    stdin_open: true
    tty: true
    volumes:
      - ${KUBECONFIG_HOST:-~/.kube}:/root/.kube:ro
    environment:
      K8S_REQUEST_TIMEOUT: "30"

  mcp-prometheus:
    build: ./prometheus
    image: sentinel-x-mcp-prometheus:latest
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL:-http://host.docker.internal:9090}
