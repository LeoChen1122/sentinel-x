# KUBECONFIG_HOST: host path mounted read-only as /root/.kube (default ~/.kube).
# Server URL in config must be reachable from the container — not 127.0.0.1.
# See docs/deploy/DEPLOY-MCP-KUBECONFIG.md (W1-4).
services:
  mcp-k8s:
    build: ../k8s
    image: sentinel-x-mcp-k8s:latest
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${KUBECONFIG_HOST:-~/.kube}:/root/.kube:ro
    environment:
      K8S_REQUEST_TIMEOUT: "30"

  mcp-prometheus:
    build: ../prometheus
    image: sentinel-x-mcp-prometheus:latest
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Read URL from compose/.env — do not use ${PROMETHEUS_BASE_URL} here (shell AUTO overrides .env).
    env_file:
      - .env
